<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 248" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The story the page tells, in six sections: problem, product, how it works, business model, proof, team and investors</title><rect width="1280" height="248" rx="24" fill="#f1f7f3"/><rect x="28.0" y="28" width="192.3" height="192" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="50.0" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">1 · PROBLEM</text><text fill="#1d1b22" font-size="18" font-weight="800" text-anchor="start"><tspan x="50.0" y="96.0">Bills get lost</tspan></text><text fill="#6b6670" font-size="14" font-weight="400" text-anchor="start"><tspan x="50.0" y="126.7">Every payment</tspan><tspan x="50.0" y="147.0">leaves a bill</tspan><tspan x="50.0" y="167.3">behind, and almost</tspan><tspan x="50.0" y="187.6">nobody keeps it.</tspan></text><rect x="234.3" y="28" width="192.3" height="192" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="256.3" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">2 · PRODUCT</text><text fill="#1d1b22" font-size="18" font-weight="800" text-anchor="start"><tspan x="256.3" y="96.0">AirDrop for</tspan><tspan x="256.3" y="116.7">bills</tspan></text><text fill="#6b6670" font-size="14" font-weight="400" text-anchor="start"><tspan x="256.3" y="147.4">Bills arrive on</tspan><tspan x="256.3" y="167.7">their own; the app</tspan><tspan x="256.3" y="188.0">shows where money</tspan><tspan x="256.3" y="208.3">leaks.</tspan></text><rect x="440.7" y="28" width="192.3" height="192" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="462.7" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">3 · HOW</text><text fill="#1d1b22" font-size="18" font-weight="800" text-anchor="start"><tspan x="462.7" y="96.0">Tap the table</tspan></text><text fill="#6b6670" font-size="14" font-weight="400" text-anchor="start"><tspan x="462.7" y="126.7">The NFC flow, from</tspan><tspan x="462.7" y="147.0">the guest&#x27;s and the</tspan><tspan x="462.7" y="167.3">staff&#x27;s side.</tspan></text><rect x="647.0" y="28" width="192.3" height="192" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="669.0" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">4 · MODEL</text><text fill="#1d1b22" font-size="18" font-weight="800" text-anchor="start"><tspan x="669.0" y="96.0">Merchants pay</tspan></text><text fill="#6b6670" font-size="14" font-weight="400" text-anchor="start"><tspan x="669.0" y="126.7">Their customers</tspan><tspan x="669.0" y="147.0">join free. SaaS</tspan><tspan x="669.0" y="167.3">plus consumer</tspan><tspan x="669.0" y="187.6">premium.</tspan></text><rect x="853.3" y="28" width="192.3" height="192" rx="18" fill="#15803D"/><text x="875.3" y="62" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="2.5">5 · PROOF</text><text fill="#ffffff" font-size="18" font-weight="800" text-anchor="start"><tspan x="875.3" y="96.0">A working</tspan><tspan x="875.3" y="116.7">product</tspan></text><text fill="#ffffff" fill-opacity="0.9" font-size="14" font-weight="400" text-anchor="start"><tspan x="875.3" y="147.4">Real screens from</tspan><tspan x="875.3" y="167.7">ezbill.live, not</tspan><tspan x="875.3" y="188.0">mock-ups.</tspan></text><rect x="1059.7" y="28" width="192.3" height="192" rx="18" fill="#ffffff" stroke="#d8e9de"/><text x="1081.7" y="62" fill="#15803D" font-size="14" font-weight="800" letter-spacing="2.5">6 · TEAM</text><text fill="#1d1b22" font-size="18" font-weight="800" text-anchor="start"><tspan x="1081.7" y="96.0">Founder &amp;</tspan><tspan x="1081.7" y="116.7">investors</tspan></text><text fill="#6b6670" font-size="14" font-weight="400" text-anchor="start"><tspan x="1081.7" y="147.4">The founder story,</tspan><tspan x="1081.7" y="167.7">early access and an</tspan><tspan x="1081.7" y="188.0">investor section.</tspan></text></svg>